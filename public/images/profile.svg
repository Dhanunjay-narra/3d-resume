<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="120" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Head & Body Silhouette -->
  <circle cx="200" cy="160" r="48" fill="url(#accentGrad)"/>
  <path d="M130 270 C 130 215, 270 215, 270 270 Z" fill="url(#accentGrad)"/>
  <!-- Decorative badge -->
  <rect x="140" y="320" width="120" height="30" rx="15" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="340" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FULL STACK DEV</text>
</svg>

